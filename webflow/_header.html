<!-- ============================================================
     AlphaWerx — Site Settings → Custom Code → HEAD  (phase 1)
     Version-controlled source of truth for the head block.
     Paste this file's contents into Webflow Site Settings.

     Changes vs the previous head:
     - preconnect added for cdn.jsdelivr.net (now the only custom origin)
     - Remix Icon <link> moved here from the G | Embed Code component
     - site CSS now loads from GitHub → jsDelivr (pinned release),
       replacing the two p9d736.csb.app links in the embed
     Remember to bump @1.0.0 here when you tag a new release.
     ============================================================ -->

<!-- Global | Webflow Head Custom Code | Start -->

<!-- Disables Zoom on Input Fields
     (accessibility trade-off: also blocks pinch-zoom — see README "optional cleanups") -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<!-- Theme Color Browser -->
<meta name="theme-color" content="#0b0c0e" />

<!-- Warm the one custom origin everything loads from -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

<!-- Icon font (moved out of the Global Embed so icons don't pop in late) -->
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

<!-- Site CSS (GitHub → jsDelivr, pinned release) -->
<link id="aw-site-css" rel="stylesheet" type="text/css"
  href="https://cdn.jsdelivr.net/gh/hamounbv/alphawerx@1.0.0/css/alphawerx.min.css" />

<!-- Preloading Fonts — this URL is the correct Mona Sans file for THIS site.
     Still commented out: it's a large TTF; the better move is converting the
     three variable fonts to WOFF2 first (see README), then preloading that.
<link rel="preload" href="https://cdn.prod.website-files.com/6a550527033ca43347ca181a/6a555a87181fa5f39fad73f0_MonaSans-VariableFont_wdth%2Cwght.ttf" as="font" type="font/ttf" crossorigin> -->

<style>
  /* Hiding Dev Supports */
  .g-embed-code,
  /* .g-grid-guide, */
  .w-webflow-badge,
  .cms-filter {
    z-index: -99999 !important;
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }
  .preloader {
    display: flex !important;
  }
  /* --------- Lenis Smooth Scrolling --------- */
  html.lenis {
    height: auto;
  }
  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }
  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }
  .lenis.lenis-stopped {
    overflow: hidden;
  }
  /* Lock scroll before Lenis/JS take over */
  html.is-loading,
  html.is-loading body {
    overflow: hidden;
    height: 100%;
  }
</style>
<!-- Global | Webflow Head Custom Code | End -->
